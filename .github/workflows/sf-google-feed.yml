# Code and output stay private (see README). Enabled by the repo variable SF_ENABLED=true.
name: '[SF] Google Merchant Center feed'

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      audit:
        description: "Audit only — print stats, don't publish"
        type: boolean
        default: false

concurrency:
  group: sf-google-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Runner scripts
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Install quiet shell
        shell: bash
        working-directory: .
        run: sudo install -m 755 runner/.github/scripts/quiet-shell.sh /usr/local/bin/quiet-shell
      - name: Private code (stshophu/siebentaschen-feed-src)
        uses: actions/checkout@v4
        with:
          repository: stshophu/siebentaschen-feed-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate feed
        env:
          SHOPIFY_STORE: ${{ secrets.SF_SHOPIFY_STORE_DOMAIN || secrets.SF_SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SF_SHOPIFY_ADMIN_TOKEN || secrets.SF_SHOPIFY_TOKEN }}
        run: |
          if [ "${{ inputs.audit }}" = "true" ]; then
            python google_feed.py --audit
          else
            python google_feed.py --out google_feed.xml --small-out google_feed_small.xml --small-max 400
          fi

      - name: Sanity-check the feed before publishing
        if: ${{ inputs.audit != true }}
        run: |
          python - <<'PY'
          import os, sys
          from xml.etree import ElementTree as ET
          G = "{http://base.google.com/ns/1.0}"
          path = "google_feed.xml"
          items = ET.parse(path).getroot().find("channel").findall("item")  # fails on bad XML
          print(f"{len(items)} items, {os.path.getsize(path)/1024/1024:.1f} MB")
          if len(items) < 500:
              sys.exit(f"only {len(items)} items — refusing to publish")
          ids = [i.findtext(G + "id") for i in items]
          if len(ids) != len(set(ids)):
              sys.exit("duplicate g:id values")
          leaked = [i.findtext(G + "title") for i in items
                    if "loro piana fabric" in (i.findtext(G + "title") or "").lower()]
          if leaked:
              sys.exit(f"{len(leaked)} fabric-brand items leaked into the feed")
          if any(i.find(G + "sale_price") is not None for i in items):
              sys.exit("sale_price must not be in the feed")
          PY

      - name: Commit if changed
        if: ${{ inputs.audit != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add google_feed.xml google_feed_small.xml
          if git diff --cached --quiet; then
            echo "No change this run."
          else
            git commit -m "Google feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -q
            git push
          fi
      - name: Publish feed files to the public feed host (stshophu/siebentaschen-feed)
        if: ${{ inputs.audit != true }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/publish-feeds.sh" google_feed.xml google_feed_small.xml
      - name: Save log and reports privately
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/save-logs.sh" stshophu/siebentaschen-feed-src "$LOG_JOB"
    if: vars.SF_ENABLED == 'true'
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      LOG_JOB: sf-build
    defaults:
      run:
        shell: quiet-shell {0}
        working-directory: src
