# Code and output stay private (see README). Enabled by the repo variable PS_ENABLED=true.
name: '[PS] Channable → Shopify Sync (daily · full)'
on:
  schedule:
    - cron: '0 3 * * *'   # once a day, 03:00 UTC — adjust to your lowest-traffic hour
  workflow_dispatch:        # also lets you click "Run workflow" manually in GitHub
concurrency:
  group: ps-shopify-channable-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      LOG_JOB: ps-sync
    steps:
      - name: Runner scripts
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Install quiet shell
        shell: bash
        working-directory: .
        run: sudo install -m 755 runner/.github/scripts/quiet-shell.sh /usr/local/bin/quiet-shell
      - name: Private code (stshophu/prod_synch)
        uses: actions/checkout@v4
        with:
          repository: stshophu/prod_synch
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/**/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run sync (full — creates + complete field sync)
        env:
          SYNC_MODE: full
          SHOPIFY_TOKEN: ${{ secrets.PS_SHOPIFY_TOKEN }}
          SHOPIFY_STORE: siebentaschen.myshopify.com
          CHANNABLE_URL: ${{ secrets.PS_CHANNABLE_URL }}
          TARGET_MARGIN: ${{ secrets.PS_TARGET_MARGIN }}
          VAT_RATE: ${{ secrets.PS_VAT_RATE }}
          MAX_DISC_DEFAULT: ${{ secrets.PS_MAX_DISC_DEFAULT }}
          MAX_DISC_HALO: ${{ secrets.PS_MAX_DISC_HALO }}
          MAX_DISC_SHOE: ${{ secrets.PS_MAX_DISC_SHOE }}
          MIN_ACCEPTABLE_MARGIN: ${{ secrets.PS_MIN_ACCEPTABLE_MARGIN }}
          HALO_BRANDS: ${{ secrets.PS_HALO_BRANDS }}
          SHOE_BRANDS: ${{ secrets.PS_SHOE_BRANDS }}
        run: python channable_sync.py
      - name: Save log and reports privately
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/save-logs.sh" stshophu/prod_synch "$LOG_JOB"
    if: vars.PS_ENABLED == 'true'
    defaults:
      run:
        shell: quiet-shell {0}
        working-directory: src
