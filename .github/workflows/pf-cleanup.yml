# Code and output stay private (see README). Enabled by the repo variable PF_ENABLED=true.
name: '[PF] Marketplace Orphan Cleanup'

on:
  schedule:
    - cron: "0 4 * * *"   # every Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Cleanup mode"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - dry-run

concurrency:
  group: pf-marketplace-api
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Runner scripts
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Install quiet shell
        shell: bash
        working-directory: .
        run: sudo install -m 755 runner/.github/scripts/quiet-shell.sh /usr/local/bin/quiet-shell
      - name: Private code (stshophu/product-feed)
        uses: actions/checkout@v4
        with:
          repository: stshophu/product-feed
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/**/package-lock.json
      - run: npm ci
      - name: Run cleanup (scheduled, live)
        if: github.event_name == 'schedule'
        env:
          SHOPIFY_DOMAIN: ${{ secrets.PF_SHOPIFY_DOMAIN }}
          SHOPIFY_TOKEN: ${{ secrets.PF_SHOPIFY_TOKEN }}
          MARKETPLACE_API_BASE: ${{ secrets.PF_MARKETPLACE_API_BASE }}
          MARKETPLACE_CLIENT_ID: ${{ secrets.PF_MARKETPLACE_CLIENT_ID }}
          MARKETPLACE_CLIENT_SECRET: ${{ secrets.PF_MARKETPLACE_CLIENT_SECRET }}
        run: node cleanup_marketplace.js
      - name: Run cleanup (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          SHOPIFY_DOMAIN: ${{ secrets.PF_SHOPIFY_DOMAIN }}
          SHOPIFY_TOKEN: ${{ secrets.PF_SHOPIFY_TOKEN }}
          MARKETPLACE_API_BASE: ${{ secrets.PF_MARKETPLACE_API_BASE }}
          MARKETPLACE_CLIENT_ID: ${{ secrets.PF_MARKETPLACE_CLIENT_ID }}
          MARKETPLACE_CLIENT_SECRET: ${{ secrets.PF_MARKETPLACE_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            node cleanup_marketplace.js --dry-run
          else
            node cleanup_marketplace.js
          fi
      - name: Save log and reports privately
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/save-logs.sh" stshophu/product-feed "$LOG_JOB"
    if: vars.PF_ENABLED == 'true'
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      LOG_JOB: pf-cleanup
    defaults:
      run:
        shell: quiet-shell {0}
        working-directory: src
