# Code and output stay private (see README). Enabled by the repo variable SF_ENABLED=true.
name: '[SF] Update Siebentaschen Product Feed'

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

concurrency:
  group: sf-siebentaschen-feed-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Runner scripts
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Install quiet shell
        shell: bash
        working-directory: .
        run: sudo install -m 755 runner/.github/scripts/quiet-shell.sh /usr/local/bin/quiet-shell
      - name: Private code (stshophu/siebentaschen-feed-src)
        uses: actions/checkout@v4
        with:
          repository: stshophu/siebentaschen-feed-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run feed export
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SF_SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SF_SHOPIFY_ADMIN_TOKEN }}
        run: python3 siebentaschen_feed_export.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add siebentaschen_product_feed.csv
          git diff --staged --quiet || git commit -m "Update product feed"
          git push
      - name: Publish feed files to the public feed host (stshophu/siebentaschen-feed)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/publish-feeds.sh" siebentaschen_product_feed.csv
      - name: Save log and reports privately
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/save-logs.sh" stshophu/siebentaschen-feed-src "$LOG_JOB"
    if: vars.SF_ENABLED == 'true'
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      LOG_JOB: sf-export
    defaults:
      run:
        shell: quiet-shell {0}
        working-directory: src
