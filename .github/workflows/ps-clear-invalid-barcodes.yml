# Code and output stay private (see README). Enabled by the repo variable PS_ENABLED=true.
name: '[PS] Clear invalid barcodes (manual, one-off)'
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually clear them? (false = dry run, only lists them)"
        type: boolean
        default: false
concurrency:
  group: ps-shopify-channable-sync
  cancel-in-progress: false
jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Runner scripts
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Install quiet shell
        shell: bash
        working-directory: .
        run: sudo install -m 755 runner/.github/scripts/quiet-shell.sh /usr/local/bin/quiet-shell
      - name: Private code (stshophu/prod_synch)
        uses: actions/checkout@v4
        with:
          repository: stshophu/prod_synch
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/**/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Scan and clear
        env:
          SHOPIFY_TOKEN: ${{ secrets.PS_SHOPIFY_TOKEN }}
          SHOPIFY_STORE: siebentaschen.myshopify.com
        run: python clear_invalid_barcodes.py ${{ inputs.apply && '--apply' || '' }}
      - name: Save log and reports privately
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/runner/.github/scripts/save-logs.sh" stshophu/prod_synch "$LOG_JOB" invalid_barcodes.csv
    if: vars.PS_ENABLED == 'true'
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      LOG_JOB: ps-clear
    defaults:
      run:
        shell: quiet-shell {0}
        working-directory: src
