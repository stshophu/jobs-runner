name: Viterbo — Daily Import of New Products

# Runs the private stshophu/viterbo-sync code.
# Idle until the repo variable VITERBO_IMPORT_ENABLED (Settings → Variables of
# THIS repo) is "true". Daily cap: variable VITERBO_DAILY_CAP (default 100).
on:
  schedule:
    - cron: "10 4 * * *"       # 04:10 UTC daily
  workflow_dispatch:
    inputs:
      commit:
        description: "Create in Shopify (otherwise dry run)"
        type: boolean
        default: false

concurrency:
  group: viterbo-shopify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    # Switched on by the repo variable RUNNER_ENABLED=true (after the secrets are in).
    if: vars.RUNNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      VITERBO_QUIET: "1"
      LOG_JOB: viterbo-import
      S: ${{ github.workspace }}/runner/.github/scripts
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with:
          repository: stshophu/viterbo-sync
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
        working-directory: src
      - name: Run import
        working-directory: src
        env:
          SHOPIFY_DOMAIN: ${{ secrets.VITERBO_SHOPIFY_DOMAIN }}
          SHOPIFY_TOKEN: ${{ secrets.VITERBO_SHOPIFY_TOKEN }}
          VITERBO_FEED_URL: ${{ secrets.VITERBO_FEED_URL }}
          VITERBO_IMPORT_ENABLED: ${{ vars.VITERBO_IMPORT_ENABLED }}
          VITERBO_DAILY_CAP: ${{ vars.VITERBO_DAILY_CAP }}
          COMMIT: ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}
        run: bash "$S/quiet-run.sh" python3 viterbo_import.py $COMMIT
      - name: Save log privately
        if: always()
        working-directory: src
        run: bash "$S/save-logs.sh" stshophu/viterbo-sync viterbo-import
